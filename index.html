<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#fff8fa"
    >

    <title>A Little Something For You ❤️</title>


    <style>

        /* =====================================================
           BASIC RESET
        ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            overflow-x: hidden;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(255, 190, 210, 0.30),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 25%,
                    rgba(220, 205, 245, 0.28),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 50% 90%,
                    rgba(255, 215, 220, 0.25),
                    transparent 35%
                ),
                #fffaf8;

            color: #634f57;

            font-family:
                Georgia,
                "Times New Roman",
                serif;
        }


        /* =====================================================
           OPENING SCREEN
        ===================================================== */

        .opening {

            position: relative;

            width: 100%;

            min-height: 100svh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            overflow: hidden;

            padding:
                30px
                20px;

        }


        .opening-content {

            position: relative;

            z-index: 10;

            width: 100%;

            max-width: 650px;

            animation:
                openingAppear
                2s
                ease
                forwards;

        }


        .opening-title {

            font-size:
                clamp(
                    32px,
                    8vw,
                    62px
                );

            font-weight: 500;

            line-height: 1.25;

            letter-spacing: -0.5px;

            color: #795864;

            text-shadow:
                0 5px 25px
                rgba(
                    130,
                    80,
                    105,
                    0.10
                );

        }


        .opening-subtitle {

            margin-top: 17px;

            font-family: Arial, sans-serif;

            font-size: 12px;

            letter-spacing: 2px;

            color: #a57b89;

        }


        .opening-line {

            width: 75px;

            height: 1px;

            margin:
                22px
                auto;

            background: #d7a6b6;

            opacity: 0.8;

        }


        @keyframes openingAppear {

            0% {

                opacity: 0;

                transform:
                    translateY(25px);

            }

            100% {

                opacity: 1;

                transform:
                    translateY(0);

            }

        }



        /* =====================================================
           SOFT BLOBS
        ===================================================== */

        .blob {

            position: absolute;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(50px);

            opacity: 0.45;

        }


        .blob-one {

            width: 190px;

            height: 190px;

            left: -80px;

            top: 5%;

            background: #ffd3e1;

        }


        .blob-two {

            width: 220px;

            height: 220px;

            right: -100px;

            top: 25%;

            background: #e4d9f5;

        }


        .blob-three {

            width: 190px;

            height: 190px;

            left: 30%;

            bottom: -80px;

            background: #ffe1d6;

        }



        /* =====================================================
           FALLING HEARTS
        ===================================================== */

        .falling-container {

            position: absolute;

            inset: 0;

            overflow: hidden;

            pointer-events: none;

            z-index: 5;

        }


        .falling {

            position: absolute;

            top: -60px;

            opacity: 0;

            animation:
                fall
                linear
                infinite,
                sway
                ease-in-out
                infinite;

        }


        .falling:nth-child(1) {

            left: 5%;

            font-size: 19px;

            animation-duration:
                7s,
                2.5s;

        }


        .falling:nth-child(2) {

            left: 15%;

            font-size: 13px;

            animation-duration:
                9s,
                3s;

            animation-delay: 1s;

        }


        .falling:nth-child(3) {

            left: 27%;

            font-size: 17px;

            animation-duration:
                8s,
                2.8s;

            animation-delay: 2s;

        }


        .falling:nth-child(4) {

            left: 40%;

            font-size: 12px;

            animation-duration:
                10s,
                3.2s;

            animation-delay: 0.7s;

        }


        .falling:nth-child(5) {

            left: 52%;

            font-size: 21px;

            animation-duration:
                7.5s,
                2.7s;

            animation-delay: 2.5s;

        }


        .falling:nth-child(6) {

            left: 64%;

            font-size: 15px;

            animation-duration:
                9.5s,
                3.4s;

            animation-delay: 1.5s;

        }


        .falling:nth-child(7) {

            left: 76%;

            font-size: 20px;

            animation-duration:
                8.5s,
                3s;

            animation-delay: 3s;

        }


        .falling:nth-child(8) {

            left: 89%;

            font-size: 13px;

            animation-duration:
                10s,
                2.6s;

            animation-delay: 0.3s;

        }


        .falling:nth-child(9) {

            left: 11%;

            font-size: 11px;

            animation-duration:
                11s,
                3s;

            animation-delay: 4s;

        }


        .falling:nth-child(10) {

            left: 72%;

            font-size: 11px;

            animation-duration:
                12s,
                3.2s;

            animation-delay: 2s;

        }


        @keyframes fall {

            0% {

                transform:
                    translateY(-60px)
                    rotate(0deg);

                opacity: 0;

            }

            10% {

                opacity: 0.8;

            }

            85% {

                opacity: 0.55;

            }

            100% {

                transform:
                    translateY(110vh)
                    rotate(180deg);

                opacity: 0;

            }

        }


        @keyframes sway {

            0%,
            100% {

                margin-left: -10px;

            }

            50% {

                margin-left: 14px;

            }

        }



        /* =====================================================
           SCROLL HINT
        ===================================================== */

        .scroll-hint {

            position: absolute;

            bottom: 28px;

            left: 50%;

            transform:
                translateX(-50%);

            z-index: 20;

            color: #ae7f8d;

            font-family: Arial, sans-serif;

            font-size: 10px;

            letter-spacing: 2px;

            animation:
                scrollBreathe
                2.5s
                ease-in-out
                infinite;

        }


        .scroll-arrow {

            display: block;

            margin-top: 8px;

            font-size: 18px;

        }


        @keyframes scrollBreathe {

            0%,
            100% {

                opacity: 0.35;

                transform:
                    translateX(-50%)
                    translateY(0);

            }

            50% {

                opacity: 1;

                transform:
                    translateX(-50%)
                    translateY(6px);

            }

        }



        /* =====================================================
           MAIN
        ===================================================== */

        .main {

            position: relative;

            width: 100%;

            padding:
                20px
                18px
                80px;

        }


        .container {

            width: 100%;

            max-width: 760px;

            margin: 0 auto;

        }



        /* =====================================================
           INTRO
        ===================================================== */

        .intro {

            min-height: 75vh;

            display: flex;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding:
                60px
                10px;

        }


        .intro-inner {

            opacity: 0;

            transform:
                translateY(35px);

            transition:
                opacity 1.2s ease,
                transform 1.2s ease;

        }


        .intro-inner.visible {

            opacity: 1;

            transform:
                translateY(0);

        }


        .hello {

            font-size:
                clamp(
                    35px,
                    9vw,
                    62px
                );

            font-weight: 500;

            color: #76545f;

            line-height: 1.2;

            margin-bottom: 18px;

        }


        .intro-text {

            color: #94737e;

            font-size: 17px;

            line-height: 1.8;

        }


        .heart-divider {

            margin-top: 28px;

            color: #d28aa0;

            font-size: 18px;

            letter-spacing: 8px;

        }



        /* =====================================================
           LETTER CARD
        ===================================================== */

        .letter {

            position: relative;

            background:
                rgba(
                    255,
                    253,
                    251,
                    0.94
                );

            border:
                1px solid
                rgba(
                    213,
                    164,
                    181,
                    0.45
                );

            border-radius: 26px;

            padding:
                32px
                21px;

            box-shadow:
                0 25px 70px
                rgba(
                    130,
                    85,
                    105,
                    0.10
                ),
                0 4px 15px
                rgba(
                    130,
                    85,
                    105,
                    0.05
                );

            backdrop-filter: blur(10px);

        }


        .letter::before {

            content: "♡";

            position: absolute;

            top: 15px;

            right: 20px;

            color: #dfaabb;

            font-size: 25px;

            opacity: 0.5;

        }


        .letter::after {

            content: "♡";

            position: absolute;

            left: 12px;

            top: 17%;

            color: #dfaabb;

            font-size: 22px;

            opacity: 0.22;

        }


        .letter-top {

            text-align: center;

            margin-bottom: 35px;

        }


        .letter-small {

            font-family: Arial, sans-serif;

            font-size: 10px;

            letter-spacing: 3px;

            text-transform: uppercase;

            color: #bd8b9b;

        }



        /* =====================================================
           MESSAGE
        ===================================================== */

        .paragraph {

            font-size: 16px;

            line-height: 1.95;

            color: #654f57;

            margin-bottom: 28px;

            opacity: 1;

            transform:
                translateY(0);

            transition:
                opacity 0.9s ease,
                transform 0.9s ease;

        }


        .paragraph.reveal {

            opacity: 0;

            transform:
                translateY(22px);

        }


        .paragraph.reveal.show {

            opacity: 1;

            transform:
                translateY(0);

        }



        /* =====================================================
           HIGHLIGHTED IMPORTANT PARAGRAPHS
        ===================================================== */

        .highlight {

            background:
                linear-gradient(
                    135deg,
                    rgba(
                        255,
                        226,
                        235,
                        0.72
                    ),
                    rgba(
                        247,
                        238,
                        251,
                        0.72
                    )
                );

            border:
                1px solid
                rgba(
                    215,
                    164,
                    183,
                    0.48
                );

            border-radius: 19px;

            padding:
                21px
                18px;

            margin:
                34px 0;

            box-shadow:
                0 12px 32px
                rgba(
                    155,
                    100,
                    125,
                    0.08
                );

        }



        /* =====================================================
           ENDING
        ===================================================== */

        .ending {

            text-align: center;

            padding:
                95px
                10px
                35px;

        }


        .ending-title {

            color: #76545f;

            font-size:
                clamp(
                    26px,
                    7vw,
                    44px
                );

            font-weight: 500;

            line-height: 1.35;

            margin-bottom: 26px;

        }


        .ending-text {

            max-width: 580px;

            margin:
                0 auto
                26px;

            color: #987782;

            font-size: 15px;

            line-height: 1.9;

        }


        .final-love {

            margin-top: 35px;

            color: #b5687f;

            font-size:
                clamp(
                    23px,
                    6vw,
                    34px
                );

            line-height: 1.5;

        }



        /* =====================================================
           DECORATIVE HEARTS
        ===================================================== */

        .decor-heart {

            position: fixed;

            z-index: 1;

            pointer-events: none;

            color: #d38ca2;

            opacity: 0.12;

            animation:
                floatingHeart
                7s
                ease-in-out
                infinite;

        }


        .h1 {

            left: 4%;

            top: 35%;

            font-size: 23px;

        }


        .h2 {

            right: 5%;

            top: 63%;

            font-size: 18px;

            animation-delay: 2s;

        }


        .h3 {

            left: 8%;

            top: 82%;

            font-size: 15px;

            animation-delay: 4s;

        }


        @keyframes floatingHeart {

            0%,
            100% {

                transform:
                    translateY(0)
                    rotate(-5deg);

            }

            50% {

                transform:
                    translateY(-20px)
                    rotate(8deg);

            }

        }



        /* =====================================================
           MUSIC BUTTON
        ===================================================== */

        .music-button {

            position: fixed;

            right: 17px;

            bottom:
                calc(
                    18px +
                    env(
                        safe-area-inset-bottom
                    )
                );

            width: 48px;

            height: 48px;

            border-radius: 50%;

            border:
                1px solid
                rgba(
                    205,
                    150,
                    168,
                    0.45
                );

            background:
                rgba(
                    255,
                    250,
                    250,
                    0.94
                );

            color: #a66b7d;

            font-size: 17px;

            display: flex;

            align-items: center;

            justify-content: center;

            box-shadow:
                0 8px 25px
                rgba(
                    130,
                    85,
                    105,
                    0.15
                );

            z-index: 100;

            cursor: pointer;

            -webkit-tap-highlight-color:
                transparent;

        }


        .music-button:active {

            transform:
                scale(0.92);

        }



        /* =====================================================
           DESKTOP
        ===================================================== */

        @media (min-width: 700px) {

            .main {

                padding-left: 30px;

                padding-right: 30px;

            }


            .letter {

                padding:
                    50px
                    55px;

            }


            .paragraph {

                font-size: 17px;

                line-height: 2;

            }


            .highlight {

                padding:
                    25px
                    28px;

            }

        }



        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media (
            prefers-reduced-motion: reduce
        ) {

            *,
            *::before,
            *::after {

                animation-duration:
                    0.01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    0.01ms !important;

                scroll-behavior:
                    auto !important;

            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         OPENING
    ===================================================== -->

    <section class="opening">


        <div class="blob blob-one"></div>

        <div class="blob blob-two"></div>

        <div class="blob blob-three"></div>


        <!-- Falling love emojis -->

        <div class="falling-container">

            <span class="falling">❤️</span>

            <span class="falling">💕</span>

            <span class="falling">✨</span>

            <span class="falling">🤍</span>
